# ============================================================
#  Construction Risk Dashboard — Configuration
# ============================================================

simulation:
  n_simulations: 10000
  random_seed: 42
  confidence_levels: [0.50, 0.80, 0.90, 0.95]

project:
  default_type: "residential"   # residential | commercial | infrastructure
  currency: "EUR"
  currency_symbol: "€"
  working_days_per_week: 5
  overhead_rate: 0.12           # 12% overhead on direct costs
  contingency_rate: 0.08        # 8% contingency (typical BTP)

risk:
  cost_overrun_threshold: 0.10  # flag if P90 > baseline + 10%
  delay_threshold_days: 30      # flag if P90 > baseline + 30 days

pert:
  lambda: 4                     # weight of most-likely estimate (standard = 4)

dashboard:
  port: 8501
  max_tasks_display: 25
